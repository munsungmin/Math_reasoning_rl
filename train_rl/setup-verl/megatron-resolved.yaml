data:
  tokenizer: null
  train_files: /home/sungmin/math_reasoning/dataset/gsm8k/train.parquet
  val_files: /home/sungmin/math_reasoning/dataset/gsm8k/test.parquet
  prompt_key: prompt
  max_prompt_length: 256
  max_response_length: 128
  train_batch_size: 4
  val_batch_size: null
  return_raw_input_ids: false
  return_raw_chat: false
  shuffle: true
  filter_overlong_prompts: true
  truncation: error
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: Qwen/Qwen2.5-1.5B
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: false
  actor:
    strategy: megatron
    ppo_mini_batch_size: 4
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    use_torch_compile: false
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: true
    optim:
      lr: 1.0e-06
      clip_grad: 1.0
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: null
      warmup_style: constant
      total_training_steps: -1
    megatron:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 2
      virtual_pipeline_model_parallel_size: null
      sequence_parallel: true
      use_distributed_optimizer: true
      seed: 1
    load_weight: true
    checkpoint:
      contents:
      - model
      - hf_model
      - optimizer
      - extra
  ref:
    megatron:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 2
      virtual_pipeline_model_parallel_size: null
      sequence_parallel: true
      use_distributed_optimizer: true
      seed: 1
    load_weight: true
    param_offload: true
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1
    top_p: 1
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.35
    ignore_eos: false
    enforce_eager: true
    free_cache_engine: true
    load_format: dummy_megatron
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 512
    max_model_len: null
    max_num_seqs: 2
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 1
    disable_log_stats: true
    enable_chunked_prefill: false
    do_sample: true
    layer_name_map:
      qkv_layer_name: qkv
      gate_proj_layer_name: gate_up
    'n': 2
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0
      'n': 1
      do_sample: false
critic:
  strategy: megatron
  optim:
    lr: 1.0e-05
    clip_grad: 1.0
    lr_warmup_steps_ratio: 0.0
    min_lr_ratio: null
    warmup_style: constant
    total_training_steps: -1
  model:
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: {}
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: false
  megatron:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 2
    virtual_pipeline_model_parallel_size: null
    sequence_parallel: true
    use_distributed_optimizer: true
    seed: 1
  load_weight: true
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null
  ppo_micro_batch_size_per_gpu: null
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  cliprange_value: 0.5
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  checkpoint:
    contents:
    - model
    - hf_model
    - optimizer
    - extra
reward_model:
  enable: false
  strategy: megatron
  megatron:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    virtual_pipeline_model_parallel_size: null
    sequence_parallel: true
    use_distributed_optimizer: true
    seed: 1
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
  load_weight: true
  param_offload: false
  micro_batch_size: null
  micro_batch_size_per_gpu: null
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  max_length: null
custom_reward_function:
  path: null
  name: compute_score
algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
trainer:
  balance_batch: true
  total_epochs: 1
  total_training_steps: null
  project_name: qwen25-math
  experiment_name: grpo-megatron
  logger: console
  val_generations_to_log_to_wandb: 0
  nnodes: 1
  n_gpus_per_node: 4
  save_freq: -1
  resume_mode: auto
  resume_from_path: null
  del_local_ckpt_after_load: false
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  val_before_train: false
