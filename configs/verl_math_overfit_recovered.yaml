# Verify SFT recovery in the original verl GRPO training loop.
# This is SFT-initialized GRPO, not a pure-RL overfitting result.
# Run: bash script/run_math_verl.sh --config-name verl_math_overfit_recovered
defaults:
  - verl_math_overfitting
  - _self_

launcher:
  experiment: overfit_recovery_sft_grpo
  keep_last_only: false
  worker_env:
    WANDB_DISABLE_GIT: "true"

actor_rollout_ref:
  model:
    lora_adapter_path: ${launcher.base_dir}/artifacts/math_error_transfer/overfit_recovery_20260912/sft_refine/step_0080
  actor:
    use_kl_loss: false

trainer:
  total_training_steps: 4
  total_epochs: ${trainer.total_training_steps}
  save_freq: 4
  test_freq: -1
