# Run with script/run_timed_grpo.py so the wall-clock limit and final evaluation
# are enforced. This continues the verified pure-RL B15 adapter, without SFT.
defaults:
  - verl_math_overfit_pure_rl_refine
  - _self_

launcher:
  experiment: full_train_pure_grpo_g16_16h
  keep_last_only: false  # The supervisor retains the latest two + validation best.
  worker_env:
    WANDB_DISABLE_GIT: "true"
    MLP_CURRENT_CAPACITY_BLOCK_EXPIRATION_TIMESTAMP: ${oc.env:MATH_RL_DEADLINE,0}

data:
  train_max_samples: -1
  rollout_distinct_question: 8
  rollout_per_question: 16

actor_rollout_ref:
  model:
    lora_adapter_path: ${launcher.base_dir}/artifacts/math_error_transfer/overfit_recovery_20260912/pure_rl/phase_b_step15/lora_adapter
  actor:
    entropy_coeff: 0.0
    calculate_entropy: false
    optim:
      lr: 1.0e-4

trainer:
  # This is only a safety ceiling; the supervisor enforces the requested 16 h.
  total_training_steps: 10000
  total_epochs: 400
  save_freq: 10
  test_freq: 10
  val_before_train: true
  esi_redundant_time: 300

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        MLP_CURRENT_CAPACITY_BLOCK_EXPIRATION_TIMESTAMP: ${oc.env:MATH_RL_DEADLINE,0}
