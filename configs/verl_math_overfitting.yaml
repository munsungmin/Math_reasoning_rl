# 실행: bash script/run_math_verl.sh --config-name verl_math_overfitting
# 고정 4문제를 10,000 step 반복 학습: 4문제 × G8 × 10,000 = 320,000 답변.

defaults:
  - verl_math
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

launcher:
  experiment: overfitting_10000_steps

data:
  train_max_samples: 4

trainer:
  total_training_steps: 10000
  # 4문제 / batch 4 = epoch당 1 step.
  total_epochs: ${trainer.total_training_steps}
