# Bounded GRPO recovery from the preserved step-900 adapter.
# Run: bash script/run_math_verl.sh --config-name verl_math_overfit_probe
defaults:
  - verl_math_overfitting
  - _self_

launcher:
  experiment: overfit_recovery_lr1e4
  keep_last_only: false
  worker_env:
    WANDB_DISABLE_GIT: "true"

actor_rollout_ref:
  model:
    lora_adapter_path: ${launcher.base_dir}/artifacts/math_error_transfer/overfit_recovery_20260912/baseline_step900/lora_adapter
  actor:
    use_kl_loss: false
    optim:
      lr: 1.0e-4

trainer:
  total_training_steps: 12
  total_epochs: ${trainer.total_training_steps}
  save_freq: 4
  test_freq: -1
